<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skill Atlas</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <a class="title" href="./">Skill Atlas</a>
    <form id="search" role="search">
      <input id="repo" name="repo" type="text" placeholder="owner/repo or https://github.com/owner/repo"
             aria-label="GitHub repository" autocomplete="off" spellcheck="false">
      <button id="scan" type="submit">Scan</button>
    </form>
  </header>
  <main>
    <aside id="skills" aria-label="Skills" aria-busy="false">
      <p id="status" role="status"></p>
      <div id="results"></div>
    </aside>
    <article id="skill" aria-live="polite"></article>
  </main>
</body>
</html>
