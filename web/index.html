<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skill Atlas</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <a class="title" href="./">Skill Atlas</a>
    <form id="search" role="search">
      <input id="repo" name="repo" type="text" placeholder="owner/repo, owner or a GitHub URL"
             aria-label="GitHub repository or organization" autocomplete="off" spellcheck="false">
      <button id="scan" type="submit">Scan</button>
    </form>
    <div id="token-controls">
      <button id="add-token" type="button" title="A GitHub token, for a higher rate limit; saved in this browser, never put in the page URL">Add token</button>
      <button id="remove-token" type="button" hidden>Remove token</button>
      <span id="token-editor" hidden>
        <input id="token" type="password" placeholder="GitHub token"
               aria-label="GitHub token, saved in this browser, never put in the page URL" autocomplete="off" spellcheck="false">
        <button id="save-token" type="button">Save</button>
        <button id="cancel-token" type="button">Cancel</button>
        <a id="create-token" href="https://github.com/settings/personal-access-tokens/new?name=Skill+Atlas&amp;description=Read-only+access+to+public+repositories%2C+for+Skill+Atlas"
           target="_blank" rel="noopener noreferrer"
           title="A new fine-grained token on GitHub: read-only, for public repositories, as GitHub suggests">Create a token</a>
      </span>
    </div>
    <a id="version" hidden></a>
  </header>
  <main>
    <aside id="skills" aria-label="Skills" aria-busy="false">
      <p id="status" role="status"></p>
      <progress id="progress" aria-label="Repositories scanned" hidden></progress>
      <div id="results"></div>
    </aside>
    <article id="skill" aria-live="polite"></article>
  </main>
</body>
</html>
