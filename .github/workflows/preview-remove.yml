# The pull request's preview removed when it is closed or merged, whatever its files: it may have
# changed the web page before. Nothing when it has no preview. See spec/preview.md.
name: Preview removal
on:
  pull_request:
    types: [closed]
permissions:
  contents: write
  pull-requests: write
  pages: read
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  remove:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The script of the default branch: a closed pull request's own may be gone.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/preview.ts remove
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
