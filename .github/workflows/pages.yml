# The web page on GitHub Pages, at https://<owner>.github.io/<repo>/: republished after each push to
# main, once the typecheck and the tests pass, with the pull requests' previews in .pr-preview/.
# preview.yml and preview-remove.yml run it again when a preview changes. Once, in the repository's settings: Pages → Source:
# GitHub Actions.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# One publication at a time: a newer push waits, the running one is not cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The pull requests' previews, from the gh-pages branch: spec/preview.md.
      - run: node scripts/preview.ts collect dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
          # .pr-preview/ starts with a `.`.
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
